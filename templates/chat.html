<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ lý CSKH</title>
<style>
  :root { --bg:#f0f2f5; --card:#fff; --text:#1c1e21; --muted:#65676b; --brand:#0866ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; justify-content:center; }
  .wrap { width:100%; max-width:640px; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:14px 18px;
           background:var(--card); border-bottom:1px solid #e4e6eb; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--brand);
            color:#fff; display:grid; place-items:center; font-weight:600; }
  header b { font-size:15px; }
  header small { display:block; color:#31a24c; font-size:12px; }
  header button { margin-left:auto; border:0; background:#e4e6eb; color:var(--text);
                  padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:9px 13px; border-radius:18px; white-space:pre-wrap;
         word-break:break-word; }
  .user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:6px; }
  .bot { align-self:flex-start; background:var(--card); border-bottom-left-radius:6px;
         box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .err { align-self:center; color:#b3261e; font-size:13px; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 1px; border-radius:50%;
                 background:var(--muted); animation:b 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes b { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
  form { display:flex; gap:8px; padding:12px 18px; background:var(--card);
         border-top:1px solid #e4e6eb; }
  input { flex:1; border:1px solid #ccd0d5; border-radius:20px; padding:11px 16px;
          font:inherit; outline:none; }
  input:focus { border-color:var(--brand); }
  form button { border:0; background:var(--brand); color:#fff; border-radius:50%;
                width:42px; height:42px; font-size:18px; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">AI</div>
    <div><b>Trợ lý CSKH</b><small>Đang hoạt động</small></div>
    <button id="reset" type="button">Cuộc trò chuyện mới</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Nhập tin nhắn…" maxlength="1000">
    <button id="send" type="submit" aria-label="Gửi">➤</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function add(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function typing() {
  const el = document.createElement('div');
  el.className = 'msg bot typing';
  el.innerHTML = '<span></span><span></span><span></span>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;
  add('user', text);
  const t = typing();
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    const data = await r.json();
    t.remove();
    if (!r.ok) add('err', data.detail || 'Có lỗi xảy ra');
    else add('bot', data.reply);
  } catch (err) {
    t.remove();
    add('err', 'Không kết nối được server');
  }
  send.disabled = false;
  input.focus();
});

document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/chat', {method: 'DELETE'});
  log.innerHTML = '';
  add('bot', 'Dạ em có thể giúp gì cho anh/chị ạ?');
});

add('bot', 'Dạ em có thể giúp gì cho anh/chị ạ?');
input.focus();
</script>
</body>
</html>
