<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang · bv-agent-msg</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8f9fb; color: #1a2230; }
  main { max-width: 420px; padding: 32px 16px; text-align: center; }
  .code { font-size: 14px; font-weight: 600; letter-spacing: .08em; color: #677285; }
  h1 { font-size: 24px; line-height: 1.3; margin: 8px 0; }
  p { color: #3b4656; margin: 0 0 24px; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  a, button { font: inherit; font-size: 14px; height: 32px; padding: 0 14px; border-radius: 4px; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
  .primary { background: #1a2230; color: #fff; border: 1px solid #1a2230; }
  .secondary { background: transparent; color: inherit; border: 1px solid #d5dae2; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1520; color: #e8ecf2; }
    p { color: #b9c3d1; }
    .code { color: #8c97a8; }
    .primary { background: #e8ecf2; color: #0f1520; border-color: #e8ecf2; }
    .secondary { border-color: #2b3546; }
  }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Không tìm thấy trang</h1>
  <p>Đường dẫn này không tồn tại hoặc đã bị đổi. Kiểm tra lại địa chỉ, hoặc quay về trang chủ.</p>
  <div class="actions">
    <button class="secondary" type="button" onclick="history.back()">Quay lại</button>
    <a class="primary" href="/">Về trang chủ</a>
  </div>
</main>
</body>
</html>
